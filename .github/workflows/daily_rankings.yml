name: Nightly NBA Rankings

on:
  schedule:
    - cron: '30 9 * * *'  # 4:30 AM EST / 2:30 AM MST daily
  workflow_dispatch:

jobs:
  build-and-rank:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas beautifulsoup4 html5lib lxml numpy

      - name: Run Ranking Script
        run: python ranker.py

      - name: Commit Updated Snapshots and Rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update rankings: $(date +'%Y-%m-%d')" || exit 0
          git push
