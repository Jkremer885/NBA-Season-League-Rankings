name: Nightly NBA Rankings

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 html5lib lxml numpy

      - name: Run Ranking Script
        run: python ranker.py

      - name: Commit and Push Rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          mkdir -p data/snapshots
          git add data/
          git commit -m "Auto-update rankings: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main